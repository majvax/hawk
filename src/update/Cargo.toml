[package]
name = "hawk-update"
description = "Finds, verifies and downloads Hawk releases from a signed feed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
minisign-verify = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
minisign = "0.7"
