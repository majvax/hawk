[package]
name = "hawk-setup"
description = "Installs, updates and removes Hawk: the machine service, the relay and the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The window shown when hawk-setup is started without a command (Windows).
# Without it, hawk-setup is command-line only and needs no WebView.
gui = ["dep:tauri", "dep:tauri-build"]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hawk-update = { path = "../update" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = "0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.9"
toml_edit = "0.23"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", optional = true, features = [] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_TpmBaseServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dev-dependencies]
minisign = "0.7"
